name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  differential-canary:
    name: Differential Canary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json
            global.json

      - name: Restore
        run: dotnet restore MonkeySharp.slnx

      - name: Build MonkeySharp.Tests (Release)
        run: dotnet build MonkeySharp.Tests/MonkeySharp.Tests.csproj --configuration Release --no-restore

      - name: Differential tests canary (Release)
        run: dotnet test MonkeySharp.Tests/MonkeySharp.Tests.csproj --configuration Release --no-build --filter FullyQualifiedName~DifferentialTests --logger "trx;LogFilePrefix=DifferentialTests" --results-directory ./TestResults

      - name: Upload differential test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: differential-test-results
          path: TestResults/*.trx
          if-no-files-found: warn

  build-and-test:
    name: Build and Test (${{ matrix.os }})
    needs: differential-canary
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json
            global.json

      - name: Restore
        run: dotnet restore MonkeySharp.slnx

      - name: Build (Release)
        run: dotnet build MonkeySharp.slnx --configuration Release --no-restore

      - name: Test solution (Release)
        run: dotnet test MonkeySharp.slnx --configuration Release --no-build --logger "trx;LogFilePrefix=MonkeySharp" --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx
          if-no-files-found: warn

  coverage:
    name: Coverage Report
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json
            global.json

      - name: Restore
        run: dotnet restore MonkeySharp.slnx

      - name: Build MonkeySharp.Tests (Release)
        run: dotnet build MonkeySharp.Tests/MonkeySharp.Tests.csproj --configuration Release --no-restore

      - name: Collect coverage (Release)
        run: dotnet test MonkeySharp.Tests/MonkeySharp.Tests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults/Coverage

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate coverage reports
        shell: bash
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator \
            -reports:"TestResults/Coverage/**/coverage.cobertura.xml" \
            -targetdir:"CoverageReport" \
            -reporttypes:"MarkdownSummaryGithub;Cobertura"

      - name: Publish coverage summary
        shell: bash
        run: cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            CoverageReport/**
            TestResults/Coverage/**/coverage.cobertura.xml
          if-no-files-found: warn
